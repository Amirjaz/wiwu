# Another name for the shop that sends visitors on, keeping the path: one in REDIRECT (its www, or an
# address it used to have) to the shop's address, one in PANEL (panel.penolinshop.com, 2026-10-24) to
# its staff panel, /panel/ there. deploy/server-setup.sh writes one per name, __TARGET__ being the
# address and, for a panel name, /panel; each has its own certificate, so https://<name> redirects too.
server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/snippets/purseshop-tls-__NAME__.conf;
    server_name __NAME__;

    # In a location rather than at server level, so certbot's challenge location still answers
    # (renewals check this name over plain HTTP here).
    location / {
        return 301 https://__TARGET__$request_uri;
    }
}
