# Another name for the shop (its www, or an address it used to have) that sends visitors to __DOMAIN__,
# keeping the path. deploy/server-setup.sh writes one per name in REDIRECT, each with its own
# certificate, so https://<name> redirects too instead of showing nisatak.com.
server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/snippets/purseshop-tls-__NAME__.conf;
    server_name __NAME__;

    # In a location rather than at server level, so certbot's challenge location still answers
    # (renewals check this name over plain HTTP here).
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}
