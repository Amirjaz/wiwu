# The purse store. __DOMAIN__ is filled in by deploy/server-setup.sh (staging: a nisatech.org
# subdomain; later the client's own .ir). DNS on ArvanCloud with its CDN proxy on, like the other
# nisatech.org hosts: Arvan terminates HTTPS and connects here over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Log and rate-limit the visitor, not the Arvan edge. Trusted only for Arvan's own ranges
    # (https://www.arvancloud.ir/fa/ips.txt, 2026-09; the same list as contech and nisatak.com).
    set_real_ip_from 185.143.232.0/22;
    set_real_ip_from 188.229.116.16/30;
    set_real_ip_from 94.101.182.0/27;
    set_real_ip_from 2.144.3.128/28;
    set_real_ip_from 37.32.16.0/27;
    set_real_ip_from 37.32.17.0/27;
    set_real_ip_from 37.32.18.0/27;
    set_real_ip_from 37.32.19.0/27;
    set_real_ip_from 185.215.232.0/22;
    set_real_ip_from 178.131.120.48/28;
    set_real_ip_from 94.101.183.0/28;
    set_real_ip_from 78.157.36.112/28;
    set_real_ip_from 95.38.61.80/28;
    set_real_ip_from 193.24.119.0/29;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Visitors reach Arvan over HTTPS; Django needs to know (secure cookies, CSRF origin check).
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto = https) {
        set $forwarded_proto https;
    }

    # Staging: a password for everything (an empty file on the real site). See server-setup.sh.
    include /etc/nginx/snippets/purseshop-access.conf;

    # The Vite build (assets/, images/, favicon). Pages come from Django.
    root /srv/purseshop/www;
    client_max_body_size 8M;  # transfer screenshots (the app takes up to 6 MB)

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml model/gltf-binary;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # .vite/manifest.json and anything else hidden stays private.
    location ~ /\. {
        deny all;
    }

    # Vite's hashed bundles never change under the same name.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 7d;
    }

    location ^~ /static/ {
        alias /srv/purseshop/app/backend/staticfiles/;
        expires 7d;
    }

    # cartbecart's webhook: a server, not a person, so no staging password. The URL holds a secret.
    location ^~ /api/payments/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8030;
    }

    location / {
        try_files $uri @django;
    }

    location @django {
        proxy_pass http://127.0.0.1:8030;
    }
}
